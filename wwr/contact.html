        <div class="columns columns-1">
            <h1>Dry Oar Rafting</h1>
            <p>7411 New River Rd</p>
            <p>Glendale, Arizona</p>
            <p>1-800-RAFTING</p>
            <p>raftinginfo@dryoar.com</p>
        </div>

        <div class="contact">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2059.096249788476!2d-112.2848904309379!3d33.54120106725223!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1765150733411!5m2!1sen!2sus"
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form>
                <div class="user">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Smith" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="jsmith@email.com" required>
                </div>

                <div class="message-purpose">
                    <p>Message Purpose</p>
                    <div>
                        <input type="radio" id="general" name="purpose" value="1" required>
                        <label for="general">General Inquiry</label>
                    </div>
                    <div>
                        <input type="radio" id="reservation" name="purpose" value="2">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" id="suggestion" name="purpose" value="3">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>

                <div class="checkbox">
                    <input type="checkbox" id="subscribe" name="subscribe" checked>
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
